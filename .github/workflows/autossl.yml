name: AutoSSL shell checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install static tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash syntax
        run: bash -n AutoSSL.sh tests/smoke.sh
      - name: ShellCheck
        run: shellcheck -S warning AutoSSL.sh tests/smoke.sh
      - name: Mocked certificate and wizard tests
        run: sudo bash tests/smoke.sh
